<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мевазор: сухофрукты, орехи и чай</title>
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
:root{--olive:#46552A;--pom:#B5283C;--pale:#F4F6E9;--ink:#26291C;--mid:#646B52;--line:#D8DDC5;--pad:clamp(16px,4.6vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,sans-serif;color:var(--ink);background:#fff;font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pom);outline-offset:2px}
h1,h2,h3{font-family:Lora,serif;line-height:1.1;font-weight:600}
.head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:12px var(--pad);background:var(--olive);color:#fff}
.logo{font:600 27px Lora,serif}
.head input{flex:1;max-width:420px;margin-left:auto;font:inherit;padding:9px 14px;border-radius:8px;border:0;min-width:80px}
.cartb{background:var(--pom);color:#fff;font-weight:800;padding:9px 16px;border-radius:8px;white-space:nowrap}
.hero{background:var(--pale);padding:clamp(28px,5vw,64px) var(--pad);display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,92px);color:var(--olive);letter-spacing:-.01em}
.hero p{font-size:20px;margin-top:14px;max-width:26em}
.hero svg{display:block;width:100%}
.shop{padding:clamp(28px,4vw,48px) var(--pad);display:grid;grid-template-columns:210px 1fr;gap:32px;align-items:start}
.side h3{font-size:19px;margin:18px 0 6px}.side h3:first-child{margin-top:0}
.side button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px}
.side button:hover{background:var(--pale)}
.side button[aria-pressed=true]{background:var(--olive);color:#fff;font-weight:800}
.side select{font:inherit;width:100%;padding:9px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
.side label{display:flex;gap:7px;align-items:center;margin-top:10px;font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.p{display:flex;flex-direction:column}
.p .img{background:var(--pale);border-radius:10px;padding:8px;display:block;width:100%}
.p .img svg{display:block;width:100%}
.p h3{font-size:20px;margin-top:10px;text-align:left}
.p small{color:var(--mid);font-size:14.5px}
.row{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.row b{font-size:19px}
.add{background:var(--olive);color:#fff;font-weight:800;padding:8px 16px;border-radius:8px}
.add:hover{background:#5A6C37}
.add:disabled{background:#BFC5AC;cursor:default}
.empty{color:var(--mid);padding:36px 0}
.foot{background:var(--ink);color:#DDE0CC;padding:22px var(--pad);font-size:14.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{text-decoration:underline;text-underline-offset:3px}
dialog{border:0;padding:0;color:var(--ink);font-family:Nunito,sans-serif}
dialog::backdrop{background:rgba(38,41,28,.55)}
#cart{margin:0 0 0 auto;height:100%;max-height:none;width:min(440px,100%)}
#cart[open]{display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:27px}.dh button{font-size:26px;line-height:1}
.db{flex:1;overflow:auto;padding:6px 20px}
.df{padding:16px 20px;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item svg{display:block;width:100%;background:var(--pale);border-radius:6px}
.qty{display:flex;align-items:center;gap:7px;margin-top:3px}
.qty button{width:27px;height:27px;border:1.5px solid var(--line);border-radius:6px;font-weight:800;line-height:1}
.tot{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin-bottom:10px}
.go{display:block;width:100%;background:var(--pom);color:#fff;font-weight:800;padding:13px;border-radius:8px;text-align:center}
.go:hover{background:#952031}.go:disabled{background:#CDB3B6;cursor:default}
form{display:grid;gap:11px}
label.f{display:grid;gap:3px;font-size:14px;font-weight:700}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;width:100%;background:#fff}
fieldset{border:0;display:grid;gap:5px}legend{font-size:14px;font-weight:700;margin-bottom:3px}
fieldset label{display:flex;gap:7px;align-items:center}fieldset input{width:auto}
.toast{position:fixed;top:72px;right:16px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;z-index:50;box-shadow:0 3px 12px rgba(38,41,28,.35);max-width:320px;animation:t .25s}
@keyframes t{from{opacity:0;transform:translateY(-10px)}}
#pv{width:min(760px,calc(100% - 24px));border-radius:12px}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;position:relative}
.pv .x{position:absolute;right:12px;top:6px;font-size:26px}
.pv svg{display:block;width:100%;background:var(--pale);border-radius:10px}
.pv h2{font-size:33px}.pv p{margin:10px 0}
#adm{width:min(760px,calc(100% - 24px));border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15.5px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.hero,.pv{grid-template-columns:1fr}.shop{grid-template-columns:1fr}.logo{font-size:22px}.side .cats{display:flex;flex-wrap:wrap;gap:4px}.side .cats button{width:auto}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.head{gap:8px}.hero svg{max-width:300px}}
</style>
</head>
<body>
<header class="head">
  <a class="logo" href="#">Мевазор</a>
  <input id="q" type="search" placeholder="Поиск по магазину" aria-label="Поиск">
  <button class="cartb" id="openCart">Корзина <span id="n">0</span></button>
</header>
<main>
<section class="hero"><div><h1>Сладость Памира в каждой горсти</h1><p>Урюк, орехи и горные травы от фермеров. Доставка по Таджикистану за 1–3 дня.</p></div><div id="heroimg"></div></section>
<section class="shop">
  <aside class="side">
    <h3>Категории</h3><div class="cats" id="cats"></div>
    <h3>Сортировка</h3><select id="sort" aria-label="Сортировка"><option value="">Сначала популярные</option><option value="a">Сначала дешевле</option><option value="d">Сначала дороже</option></select>
    <label><input type="checkbox" id="stock"> Только в наличии</label>
  </aside>
  <div class="grid" id="grid"></div>
</section>
</main>
<footer class="foot"><span>Мевазор. Пример сайта, магазин вымышленный, оплата не проводится.</span><button id="openAdm">Панель заказов магазина</button></footer>

<dialog id="cart" aria-label="Корзина"><div class="dh"><h2 id="ct">Корзина</h2><button data-c aria-label="Закрыть">×</button></div><div class="db" id="cb"></div><div class="df" id="cf"></div></dialog>
<dialog id="pv" aria-label="Товар"><div class="pv" id="pvb"></div></dialog>
<dialog id="adm" aria-label="Заказы"><div class="dh"><h2>Заказы</h2><button data-c aria-label="Закрыть">×</button></div><div class="db" id="admb" style="padding-bottom:18px"></div></dialog>

<script src="../_shared/demo.js"></script>
<script>
const P=[
 {id:1,n:'Курага Хубони',c:'Сухофрукты',w:'500 г',p:48,col:'#EE9B2D',k:'dot'},{id:2,n:'Чернослив',c:'Сухофрукты',w:'500 г',p:42,col:'#3D2433',k:'dot'},
 {id:3,n:'Изюм кишмиш',c:'Сухофрукты',w:'500 г',p:32,col:'#9A6B2D',k:'dot'},{id:4,n:'Шелковица сушёная',c:'Сухофрукты',w:'300 г',p:36,col:'#E2D2A5',k:'dot'},
 {id:5,n:'Грецкий орех',c:'Орехи',w:'500 г',p:62,col:'#B98A52',k:'nut'},{id:6,n:'Миндаль',c:'Орехи',w:'400 г',p:78,col:'#C58F5F',k:'nut'},
 {id:7,n:'Фисташки каратау',c:'Орехи',w:'300 г',p:96,col:'#8DA24F',k:'nut',out:true},{id:8,n:'Фундук',c:'Орехи',w:'400 г',p:70,col:'#A5703F',k:'nut'},
 {id:9,n:'Чай с чабрецом',c:'Чай и травы',w:'100 г',p:24,col:'#6F8F4E',k:'leaf'},{id:10,n:'Зелёный чай №95',c:'Чай и травы',w:'200 г',p:28,col:'#54763C',k:'leaf'},
 {id:11,n:'Мёд горный',c:'Сладости',w:'500 г',p:88,col:'#DE9B1C',k:'jar'},{id:12,n:'Нишолло',c:'Сладости',w:'300 г',p:34,col:'#F3EEDC',k:'jar',out:true}];
const $=s=>document.querySelector(s);const som=n=>n.toLocaleString('ru-RU')+' сом.';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cart=store.get('mz-cart',{}),cat='Все';
function img(p){let s='';let i=0;
 for(let y=128;y<=206;y+=19)for(let x=58;x<=142;x+=19){const dx=(i*7%9)-4,dy=(i*5%7)-3;i++;
  if(p.k==='leaf')s+=`<path d="M${x+dx} ${y+dy}q9-13 18 0q-9 13-18 0z" fill="${p.col}"/>`;
  else if(p.k==='nut')s+=`<ellipse cx="${x+dx+6}" cy="${y+dy}" rx="11" ry="8" fill="${p.col}" stroke="#26291C" stroke-opacity=".3"/>`;
  else if(p.k==='jar')s+=`<rect x="${x-5}" y="${y-8}" width="24" height="24" fill="${p.col}"/>`;
  else s+=`<circle cx="${x+dx+6}" cy="${y+dy}" r="9.5" fill="${p.col}" stroke="#26291C" stroke-opacity=".22"/>`}
 return `<svg viewBox="0 0 220 240" role="img" aria-label="${p.n}"><rect x="42" y="56" width="136" height="164" rx="12" fill="#fff" stroke="#46552A" stroke-width="2.5"/><rect x="60" y="30" width="100" height="27" rx="5" fill="#46552A"/><clipPath id="c${p.id}"><rect x="44" y="108" width="132" height="110" rx="10"/></clipPath><g clip-path="url(#c${p.id})">${s}</g><rect x="60" y="72" width="100" height="26" fill="#F4F6E9"/><rect x="70" y="83" width="80" height="4" fill="#46552A"/></svg>`}
$('#heroimg').innerHTML=img({...P[0],id:'h'});
const cats=['Все',...new Set(P.map(p=>p.c))];
function drawCats(){$('#cats').innerHTML=cats.map(c=>`<button aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join('')}
function draw(){let r=P.filter(p=>(cat==='Все'||p.c===cat)&&p.n.toLowerCase().includes($('#q').value.trim().toLowerCase())&&(!$('#stock').checked||!p.out));
 const s=$('#sort').value;if(s)r=[...r].sort((a,b)=>s==='a'?a.p-b.p:b.p-a.p);
 $('#grid').innerHTML=r.map(p=>`<article class="p"><button class="img" data-v="${p.id}" aria-label="Подробнее: ${p.n}">${img(p)}</button><h3>${p.n}</h3><small>${p.w}${p.out?', нет в наличии':''}</small><div class="row"><b>${som(p.p)}</b><button class="add" data-a="${p.id}" ${p.out?'disabled':''}>${p.out?'Нет':'В корзину'}</button></div></article>`).join('')||'<p class="empty">Такого товара нет. Попробуйте другой запрос.</p>'}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((a,[i,q])=>a+P.find(p=>p.id==i).p*q,0);
function save(){store.set('mz-cart',cart);$('#n').textContent=count()}
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;(document.querySelector('dialog[open]')||document.body).appendChild(e);setTimeout(()=>e.remove(),3200)}
function add(id){cart[id]=(cart[id]||0)+1;save();toast(P.find(p=>p.id==id).n+': в корзине')}
function drawCart(){$('#ct').textContent='Корзина';const ids=Object.keys(cart);
 $('#cb').innerHTML=ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="item">${img(p)}<div><b>${p.n}</b><div class="qty"><button data-m="${i}" aria-label="Меньше">−</button>${cart[i]}<button data-p="${i}" aria-label="Больше">+</button></div></div><b>${som(p.p*cart[i])}</b></div>`}).join('')||'<p class="empty">В корзине пока пусто. Добавьте что-нибудь вкусное.</p>';
 $('#cf').innerHTML=`<div class="tot"><span>Итого</span><span>${som(total())}</span></div><button class="go" id="check" ${ids.length?'':'disabled'}>Оформить заказ</button>`}
function checkout(){$('#ct').textContent='Оформление';
 $('#cb').innerHTML=`<form id="of" style="padding:12px 0"><label class="f">Имя<input name="name" required></label><label class="f">Телефон<input name="tel" required type="tel" placeholder="+992"></label><label class="f">Адрес<input name="addr" required placeholder="Город, улица, дом"></label>
 <fieldset><legend>Доставка</legend><label><input type="radio" name="d" checked value="Курьер"> Курьер, 15 сом.</label></fieldset>
 <fieldset><legend>Оплата</legend><label><input type="radio" name="pay" checked value="При получении"> При получении</label></fieldset></form>`;
 $('#cf').innerHTML=`<div class="tot"><span>К оплате</span><span>${som(total()+15)}</span></div><button class="go" type="submit" form="of">Подтвердить заказ</button>`}
function place(f){const o={id:1000+store.get('mz-orders',[]).length+1,name:f.name.value,sum:total()+15,items:count(),st:'Новый'};
 const list=store.get('mz-orders',[]);list.unshift(o);store.set('mz-orders',list);cart={};save();
 $('#ct').textContent='Заказ принят';
 $('#cb').innerHTML=`<div style="padding:26px 0"><h2 style="font-size:34px;color:var(--olive)">Заказ №${o.id}</h2><p style="margin-top:10px">${o.name}, спасибо! Менеджер свяжется с вами для подтверждения. На настоящем сайте заказ сразу придёт владельцу в Telegram.</p></div>`;
 $('#cf').innerHTML=`<button class="go" data-c>Вернуться в магазин</button>`;toast('Новый заказ №'+o.id+' отправлен менеджеру')}
function drawAdm(){const l=store.get('mz-orders',[]);$('#admb').innerHTML=l.length?`<table><tr><th>Заказ</th><th>Клиент</th><th>Товаров</th><th>Сумма</th><th>Статус</th></tr>${l.map((o,i)=>`<tr><td>№${o.id}</td><td>${o.name}</td><td>${o.items}</td><td>${som(o.sum)}</td><td><select data-st="${i}" aria-label="Статус заказа">${['Новый','Собирается','Доставлен'].map(s=>`<option ${s===o.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<p class="empty">Заказов пока нет. Оформите заказ в магазине, и он появится здесь.</p>'}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.cat){cat=d.cat;drawCats();draw()}
 if(d.a)add(+d.a);
 if(d.v){const p=P.find(x=>x.id==d.v);$('#pvb').innerHTML=`<button class="x" data-c aria-label="Закрыть">×</button>${img(p)}<div><h2>${p.n}</h2><p>${p.w}. Собрано вручную, без сахара и консервантов.</p><p style="font-size:24px;font-weight:800">${som(p.p)}</p><button class="add" data-a="${p.id}" ${p.out?'disabled':''}>${p.out?'Нет в наличии':'В корзину'}</button></div>`;$('#pv').showModal()}
 if(d.m){cart[d.m]--;if(cart[d.m]<1)delete cart[d.m];save();drawCart()}
 if(d.p){cart[d.p]++;save();drawCart()}
 if('c' in d)t.closest('dialog').close();
 if(t.id==='check')checkout()});
document.addEventListener('submit',e=>{if(e.target.id==='of'){e.preventDefault();place(e.target)}});
document.addEventListener('change',e=>{if(e.target.dataset.st){const l=store.get('mz-orders',[]);l[e.target.dataset.st].st=e.target.value;store.set('mz-orders',l)}});
$('#openCart').onclick=()=>{drawCart();$('#cart').showModal()};
$('#openAdm').onclick=()=>{drawAdm();$('#adm').showModal()};
['q','sort','stock'].forEach(i=>$('#'+i).addEventListener('input',draw));
drawCats();draw();save();
</script>
</body>
</html>
