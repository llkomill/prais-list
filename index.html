<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разработка сайтов под ключ: коммерческое предложение</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="sheet">
  <div id="logo"></div>
  <p class="kicker">Коммерческое предложение</p>
  <h1>Разработка сайтов под ключ</h1>
  <div class="rule"></div>
  <p class="lead" id="lead"></p>

  <h2>Обзор пакетов</h2>
  <table>
    <thead class="ov-head"><tr><th>Пакет</th><th class="r">Стоимость</th><th class="r">Срок</th></tr></thead>
    <tbody id="overview"></tbody>
  </table>

  <h2 id="packages">Пакеты подробно</h2>
  <div id="details"></div>

  <h2>Дополнительные услуги</h2>
  <p>Добавляются к любому пакету по необходимости. Цены — от указанных.</p>
  <div class="addons" id="addons"></div>

  <h2>Что оплачивается отдельно</h2>
  <p id="extras"></p>

  <h2>Условия работы</h2>
  <p id="terms"></p>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
